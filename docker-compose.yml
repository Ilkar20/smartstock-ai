services:
  postgres:
    image: postgres:17
    container_name: smartstock-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: smartstock
      POSTGRES_PASSWORD: smartstock_dev
      POSTGRES_DB: smartstock_db

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartstock -d smartstock_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: